<h1>{{titulo}}</h1>
<h2>{{subtitulo}}</h2>

<section class="search-container">
  <input 
    type="text" 
    placeholder="Buscar por título o categoría..." 
    [(ngModel)]="searchTerm"
    (ngModelChange)="onSearchChange()"
    class="search-input"
  />
</section>

<section>
  <app-product-form (productCreated)="addProduct($event)" />
</section>

<section class="product-list">
  @for (product of filteredProducts; track product.id) {
    <app-product-cart 
      [product]="product" 
      (productDeleted)="deleteProduct($event)" 
    />
  } @empty {
    @if (products.length === 0) {
      <p class="no-results">Cargando o no hay productos registrados...</p>
    } @else {
      <p class="no-results">No se encontraron productos que coincidan con "{{ searchTerm }}".</p>
    }
  }
</section>
